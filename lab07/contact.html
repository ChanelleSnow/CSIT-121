<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Contact Form</title>
    <link href="html.css" rel="stylesheet" type="text/css">
</head>
<body>
    <a href="tierlist.html">Tier-List</a>
    <br>
    <form action="" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="appealing">Age</label>
        <input type="text" id="age" name="age" required>
        <br>
        <label for="message">What kind of music do you like? </label>
        <p>Please choose a genre below:</p>
      
      <form action="/action_page.php">
        <label for="genre">Choose a genre:</label>
        <select id="genre" name="genre">
            <option value="Select">Select</option>
          <option value="Rock&Roll">Rock&Roll</option>
          <option value="Hip Hop">Hip hop</option>
          <option value="Alternative">Jazz</option>
          <option value="Reggae">Reggae</option>
          <option value="Country">Classical</option>
          <option value="R&B">R&B</option>
        </select>
        
      
        <p class="button">
          <button type="submit">Submit</button>
        </p>
      </form>  
</body>
</html>
